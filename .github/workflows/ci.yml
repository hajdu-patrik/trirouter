name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .[dev]
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Routing evaluation (Hungarian + English)
        run: python eval/eval_router.py
      - name: Installer dry run
        run: python install.py --dry-run --yes --providers=claude,codex,antigravity --no-migrate
      - name: Package entry points
        run: |
          python -m trirouter --help
          trirouter --help
