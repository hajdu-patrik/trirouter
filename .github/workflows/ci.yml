name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .[dev]
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Generated files in sync (docs/cli.md)
        run: python -m trirouter sync --check
      - name: Routing evaluation (Hungarian + English)
        run: python eval/eval_router.py
      - name: Installer dry run
        run: python install.py --dry-run --yes --providers=claude,codex,antigravity --no-migrate
      - name: Package entry points
        run: |
          python -m trirouter --help
          trirouter --help
