name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .[dev]
      - name: Lint (unused imports and names)
        run: python -m pyflakes trirouter tests eval install.py
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Generated files in sync (docs/cli.md)
        run: python -m trirouter sync --check
      - name: Routing evaluation (Hungarian + English)
        run: python eval/eval_router.py
      - name: Installer dry run
        run: python install.py --dry-run --yes --providers=claude,codex,antigravity --skip=migrate
      - name: End-to-end install in a scratch HOME (Linux, macOS)
        if: runner.os != 'Windows'
        run: python tests/smoke_install.py
      - name: Package entry points
        run: |
          python -m trirouter --help
          trirouter --help
